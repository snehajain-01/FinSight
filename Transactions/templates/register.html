{% extends "base.html" %}


{% block content %}


<h2>
    Create Account
</h2>


<form method="POST">


    <input
        type="text"
        name="name"
        placeholder="Enter your name"
        required
    >


    <br><br>


    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
    >


    <br><br>


    <input
        type="password"
        name="password"
        placeholder="Enter your password"
        required
    >


    <br><br>


    <button type="submit">

        Register

    </button>


</form>


<p>

    Already have an account?

    <a href="{{ url_for('login') }}">

        Login

    </a>

</p>


{% endblock %}
